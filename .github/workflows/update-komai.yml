name: Update Komai Cask

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-komai
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'etkecc/homebrew-komai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release validation
        run: python3 -m unittest discover -s tests -v
      - name: Fetch the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/etkecc/komai/releases/latest > "$RUNNER_TEMP/release.json"
      - name: Validate release metadata and prepare the cask
        id: release
        run: python3 scripts/update_cask.py --release-json "$RUNNER_TEMP/release.json"

  validate:
    needs: check
    # A manual run also validates an unchanged cask before enabling publishing.
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/validate.yml
    with:
      version: ${{ needs.check.outputs.version }}
      sha256: ${{ needs.check.outputs.sha256 }}

  publish:
    needs: [check, validate]
    if: needs.check.outputs.changed == 'true' && vars.KOMAI_AUTO_UPDATE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Apply the validated version and checksum
        env:
          KOMAI_VERSION: ${{ needs.check.outputs.version }}
          KOMAI_SHA256: ${{ needs.check.outputs.sha256 }}
        run: python3 scripts/update_cask.py --version "$KOMAI_VERSION" --sha256 "$KOMAI_SHA256"
      - name: Publish only if main still matches the tested revision
        env:
          KOMAI_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main changed during validation; rerun the updater."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/komai.rb
          git commit -m "komai: update to $KOMAI_VERSION"
          git push origin HEAD:refs/heads/main
